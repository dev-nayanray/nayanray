  <body>
    <!-- Skip-to-content link: keyboard users press Tab to jump straight
         to the main content, skipping the nav. Google's Lighthouse
         accessibility audit checks for this and it's a ranking factor. -->
    <a
      href="#main-content"
      class="skip-link"
      style="position:absolute;left:-9999px;top:1rem;z-index:100;padding:0.75rem 1.5rem;background:#7c5cff;color:#fff;border-radius:0.5rem;font-weight:600;text-decoration:none;transition:left 0.2s;"
      onfocus="this.style.left='1rem'"
      onblur="this.style.left='-9999px'"
    >
      Skip to main content
    </a>

    <main id="root" role="main" aria-labelledby="main-heading">
      <!-- React app mounts here -->
    </main>

    <!-- Noscript fallback: Google's crawler renders JS, but if JS fails
         this still gives crawlers and users a meaningful page. -->
    <noscript>
