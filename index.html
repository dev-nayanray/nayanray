    <!-- ✅ Primary Meta Tags — title ≤60 chars, description ≤160 chars

    <!-- Theme-color: matches manifest so browser address bar / mobile UI

    <!-- hreflang — declares the page language and region for Google.
         Even for a single-language site, this tells Google the page is
         English and targeted globally. Helps with international ranking. -->

    <link rel="alternate" hreflang="x-default" href="https://nayanray.com/" />

    <!-- ✅ Vite entry point -->
    <script type="module" src="/src/main.tsx" defer></script>

  <body>
    <!-- Skip-to-content link: keyboard users press Tab to jump straight
         to the main content, skipping the nav. Google's Lighthouse
         accessibility audit checks for this and it's a ranking factor. -->
    <a
      href="#main-content"
      class="skip-link"
      style="position:absolute;left:-9999px;top:1rem;z-index:100;padding:0.75rem 1.5rem;background:#7c5cff;color:#fff;border-radius:0.5rem;font-weight:600;text-decoration:none;transition:left 0.2s;"
      onfocus="this.style.left='1rem'"
      onblur="this.style.left='-9999px'"
    >
      Skip to main content
    </a>

    <!-- React mount point — use a <div>, not <main>. The App component
         renders its own <main id="main-content"> inside React. Using
         <main> here too creates two <main> elements, which violates
         the HTML spec (one <main> per document) and breaks the
         skip-to-content link target. -->
    <div id="root">
      <!-- React app mounts here -->
    </div>

    <!-- Noscript fallback: Google's crawler renders JS, but if JS fails
         this still gives crawlers and users a meaningful page. -->
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:system-ui,sans-serif;">
        <h1>Nayan Ray — Full Stack Web Developer</h1>
        <p>This site requires JavaScript. Please enable it to view the portfolio, projects, and the markhubs Store Manager for Telegram plugin.</p>
        <p>
          <a href="https://github.com/dev-nayanray/nayanray">View on GitHub</a>
          ·
          <a href="https://github.com/dev-nayanray/markhubs-store-manager-for-telegram">
            markhubs Telegram Plugin
          </a>
        </p>
      </div>
    </noscript>
  </body>
